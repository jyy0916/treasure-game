<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异步寻宝：迷雾之境</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #141418;
            --text: #d4d4d8;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --gold: #fbbf24;
            --hp: #ef4444;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            width: 900px;
            height: 650px;
            background: var(--panel);
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 顶部状态栏：加入 HP 和 Gold */
        .status-bar {
            height: 50px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 16px;
            border-bottom: 1px solid #222;
        }

        .stats { display: flex; gap: 20px; font-weight: bold; }
        .stat-hp { color: var(--hp); }
        .stat-gold { color: var(--gold); }
        .stat-shield { color: #3b82f6; }

        /* 中间动画舞台 */
        .stage {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e1e24 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .light-beam {
            position: absolute;
            width: 200px;
            height: 200%;
            background: linear-gradient(to bottom, rgba(139, 92, 246, 0.05), transparent);
            transform: rotate(20deg);
            top: -50%;
            left: 20%;
            pointer-events: none;
        }

        .hero {
            font-size: 70px;
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.4));
            transition: all 0.5s;
            z-index: 10;
        }

        /* 各种特效类 */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translate(-50%, 0); }
            25% { transform: translate(-55%, -5px); }
            50% { transform: translate(-45%, 5px); }
            75% { transform: translate(-52%, -2px); }
        }

        .flash-red { animation: flashRed 0.5s; }
        @keyframes flashRed { 50% { background-color: rgba(239, 68, 68, 0.3); } }

        .float-text {
            position: absolute;
            font-size: 30px;
            font-weight: bold;
            animation: floatUp 1.5s forwards;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
        }

        /* 底部控制台 */
        .console {
            height: 250px;
            background: #0f0f13;
            border-top: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .log-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.8;
            scroll-behavior: smooth;
        }

        .cursor::after { content: '▋'; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .log-info { color: #a1a1aa; }
        .log-success { color: var(--success); }
        .log-danger { color: var(--danger); }
        .log-gold { color: var(--gold); text-shadow: 0 0 10px var(--gold); font-weight: bold; }

        .actions { display: flex; gap: 10px; justify-content: center; min-height: 40px; }

        button {
            padding: 10px 20px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent); }
        button.danger { color: var(--danger); border-color: var(--danger); }
        button.danger:hover:not(:disabled) { background: var(--danger); box-shadow: 0 0 15px var(--danger); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        input[type="text"] {
            padding: 10px; font-size: 16px; width: 150px; background: #000; 
            border: 1px solid var(--accent); color: white; outline: none; text-align: center;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="status-bar">
        <span>系统：异步寻宝引擎</span>
        <div class="stats">
            <span class="stat-hp" id="ui-hp">❤️ HP: 100</span>
            <span class="stat-gold" id="ui-gold">💰 Gold: 50</span>
            <span class="stat-shield" id="ui-shield" style="display:none;">🛡️ 护盾</span>
        </div>
    </div>
    
    <div class="stage" id="stage">
        <div class="light-beam"></div>
        <div class="hero" id="hero">🧑‍🦯</div>
    </div>
    
    <div class="console">
        <div class="log-box" id="logBox"></div>
        <div class="actions" id="actions">
            <button id="startBtn">唤醒探险者</button>
        </div>
    </div>
</div>

<script>
    const logBox = document.getElementById('logBox');
    const actionsDiv = document.getElementById('actions');
    const hero = document.getElementById('hero');
    const stage = document.getElementById('stage');
    const uiHp = document.getElementById('ui-hp');
    const uiGold = document.getElementById('ui-gold');
    const uiShield = document.getElementById('ui-shield');

    // ==========================================
    // 核心状态系统 (RPG 数值)
    // ==========================================
    let playerState = {
        hp: 100,
        maxHp: 100,
        gold: 50,
        hasShield: false
    };

    function updateUI() {
        uiHp.textContent = `❤️ HP: ${playerState.hp}`;
        uiGold.textContent = `💰 Gold: ${playerState.gold}`;
        if (playerState.hasShield) {
            uiShield.style.display = 'inline';
        } else {
            uiShield.style.display = 'none';
        }
    }

    // 统一的扣血逻辑
    function takeDamage(amount, reason) {
        if (playerState.hasShield) {
            playerState.hasShield = false; // 护盾碎裂
            spawnFloatText('护盾抵挡!', '#3b82f6');
            typeLog(`💥 药水化作护盾，抵挡了致命伤害！`, 'log-success');
            updateUI();
            return false; // 未死亡
        }

        playerState.hp -= amount;
        if (playerState.hp < 0) playerState.hp = 0;
        
        flashRed(); shakeScreen(); spawnFloatText(`-${amount} HP`, '#ef4444');
        updateUI();
        
        if (playerState.hp <= 0) {
            throw new Error(`${reason}，你倒下了...探险结束。`);
        } else {
            typeLog(`⚠️ 你受到了 ${amount} 点伤害 (${reason})`, 'log-danger');
            return false;
        }
    }

    // ==========================================
    // UI 辅助函数
    // ==========================================
    function typeLog(text, className = 'log-info') {
        return new Promise(resolve => {
            const p = document.createElement('div');
            p.className = className;
            logBox.appendChild(p);
            let i = 0;
            const timer = setInterval(() => {
                p.textContent += text.charAt(i);
                logBox.scrollTop = logBox.scrollHeight;
                i++;
                if (i >= text.length) {
                    clearInterval(timer);
                    p.classList.remove('cursor');
                    resolve();
                }
            }, 30);
            p.classList.add('cursor');
        });
    }

    function shakeScreen() {
        stage.classList.add('shake');
        setTimeout(() => stage.classList.remove('shake'), 500);
    }

    function flashRed() {
        stage.classList.add('flash-red');
        setTimeout(() => stage.classList.remove('flash-red'), 500);
    }

    function spawnFloatText(text, color) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.textContent = text;
        el.style.color = color;
        el.style.left = '50%';
        el.style.bottom = '40%';
        stage.appendChild(el);
        setTimeout(() => el.remove(), 1500);
    }

    // ==========================================
    // 剧情与逻辑模块
    // ==========================================
    class TreasureMap {
        static async getInitialClue() {
            await typeLog("📜 你在废墟中摸索...");
            await new Promise(r => setTimeout(r, 1000));
            spawnFloatText('💡', '#fbbf24');
            await typeLog("你找到了一张古地图和 0 枚金币。", 'log-success');
        }

        static async meetMerchant() {
            await typeLog("🧙‍♂️ 路上，你遇到了一位神秘商人。");
            await typeLog("商人说：'前方极度危险，这瓶护盾药水能救你一命，卖 30 金币。'");
            
            return new Promise(resolve => {
                // 如果钱不够，按钮变灰
                const canAfford = playerState.gold >= 30;
                
                actionsDiv.innerHTML = `
                    <button id="buyBtn" ${canAfford ? '' : 'disabled'}>购买药水 (30 Gold)</button>
                    <button id="ignoreBtn" class="danger">不买，直接走</button>
                `;
                
                document.getElementById('buyBtn').onclick = async () => {
                    actionsDiv.innerHTML = '';
                    playerState.gold -= 30;
                    playerState.hasShield = true;
                    updateUI();
                    await typeLog("你买下了药水，获得了一层【护盾】。", 'log-success');
                    resolve();
                };
                
                document.getElementById('ignoreBtn').onclick = async () => {
                    actionsDiv.innerHTML = '';
                    await typeLog("你拒绝了商人，捂紧了口袋里的 50 金币。");
                    resolve();
                };
            });
        }

        static async crossForest() {
            stage.style.background = 'radial-gradient(circle at center, #142b1c 0%, #000 100%)';
            await typeLog("🌲 你进入了迷雾森林，前方有两条路：");
            
            return new Promise(resolve => {
                actionsDiv.innerHTML = `
                    <button id="pathLeft" class="danger">阴森小径 (怪物，扣40血)</button>
                    <button id="pathRight">宽阔大路 (陷阱，扣20血)</button>
                `;

                document.getElementById('pathLeft').onclick = async () => {
                    actionsDiv.innerHTML = '';
                    await typeLog("你走进了阴森小径，突然窜出一只野狼！");
                    // 每次扣血操作，都在 try/catch 里面处理
                    try {
                        takeDamage(40, "野狼撕咬");
                        resolve("你击退了野狼，逃出森林。");
                    } catch (e) {
                        resolve(Promise.reject(e.message)); // 直接把错误抛给外层
                    }
                };

                document.getElementById('pathRight').onclick = async () => {
                    actionsDiv.innerHTML = '';
                    await typeLog("你选择了大路，却不小心踩中了捕兽夹！");
                    try {
                        takeDamage(20, "捕兽夹");
                        resolve("你忍痛挣脱，走出了森林。");
                    } catch (e) {
                        resolve(Promise.reject(e.message));
                    }
                };
            });
        }

        static async enterTemple() {
            stage.style.background = 'radial-gradient(circle at center, #2b1d13 0%, #000 100%)';
            await typeLog("🏛️ 你来到了古老神庙的封印大门前。");
            await typeLog("门上刻着奇怪的符文。你仔细端详，上面画着 3 个重叠的圆圈。");
            await typeLog("（提示：3个圆圈代表数字 8，尝试输入密码）");
            
            return new Promise(resolve => {
                actionsDiv.innerHTML = `
                    <input type="text" id="pwdInput" placeholder="输入3位密码">
                    <button id="submitPwd">开锁</button>
                `;
                
                document.getElementById('submitPwd').onclick = async () => {
                    const val = document.getElementById('pwdInput').value;
                    actionsDiv.innerHTML = '';
                    
                    if (val === "888") {
                        spawnFloatText('🔓', '#10b981');
                        await typeLog("石盘隆隆转动，大门为你敞开。", 'log-success');
                        resolve();
                    } else {
                        await typeLog("符文闪烁红光，大门没有反应。（密码错误）", 'log-danger');
                        // 允许玩家重新输入
                        const retry = await TreasureMap.enterTemple();
                        resolve(retry);
                    }
                };
            });
        }

        static async openTreasureBox() {
            await typeLog("室内有两个箱子，一个金光闪闪，一个锈迹斑斑。");
            
            return new Promise(resolve => {
                actionsDiv.innerHTML = `
                    <button id="boxGold">开启金箱子</button>
                    <button id="boxRust" class="danger">开启锈箱子</button>
                `;

                document.getElementById('boxGold').onclick = async () => {
                    actionsDiv.innerHTML = '';
                    await typeLog("你走向了金色的箱子...");
                    await new Promise(r => setTimeout(r, 800));
                    if (Math.random() < 0.5) {
                        try {
                            takeDamage(999, "金箱子爆炸");
                        } catch (e) {
                            resolve(Promise.reject(e.message));
                        }
                    } else {
                        playerState.gold += 1000;
                        updateUI();
                        spawnFloatText('+1000 Gold', '#fbbf24');
                        resolve("🎉 你获得了无尽的财宝！");
                    }
                };

                document.getElementById('boxRust').onclick = async () => {
                    actionsDiv.innerHTML = '';
                    await typeLog("你走向了生锈的箱子...");
                    await new Promise(r => setTimeout(r, 800));
                    if (Math.random() < 0.3) {
                        try {
                            takeDamage(50, "毒蛇咬伤");
                        } catch (e) {
                            resolve(Promise.reject(e.message));
                        }
                    } else {
                        playerState.gold += 300;
                        updateUI();
                        spawnFloatText('+300 Gold', '#fbbf24');
                        resolve("💎 你找到了几颗魔法钻石！");
                    }
                };
            });
        }
    }

    // ==========================================
    // 主控流程 (async/await)
    // ==========================================
    async function startGame() {
        // 重置所有状态
        playerState = { hp: 100, maxHp: 100, gold: 50, hasShield: false };
        updateUI();
        
        logBox.innerHTML = '';
        actionsDiv.innerHTML = '';
        hero.textContent = '🧑‍🦯';
        
        try {
            await TreasureMap.getInitialClue();
            await TreasureMap.meetMerchant();
            
            // 因为内部的 takeDamage 可能抛出异常，所以外层用 try catch 包裹
            await TreasureMap.crossForest(); 
            
            await TreasureMap.enterTemple();
            
            hero.textContent = '🤩';
            const finalRes = await TreasureMap.openTreasureBox();
            
            await typeLog(finalRes, 'log-gold');
            await typeLog("—— 游戏通关，伟大的探险家！ ——", 'log-success');

        } catch (error) {
            // 统一捕获血量归零的错误
            await typeLog(`💀 ${error}`, 'log-danger');
            hero.textContent = '💀';
            hero.style.bottom = '10%';
        } finally {
            actionsDiv.innerHTML = `<button id="restartBtn">重新开始</button>`;
            document.getElementById('restartBtn').onclick = startGame;
        }
    }

    document.getElementById('startBtn').onclick = startGame;
</script>
</body>
</html>
